schemaVersion: 1
identifier: shared-memories
displayName: "Shared Memories"
description: Team-shared Claude Code memories via a dedicated git repo
author: Bruno Guidolim
minMCSVersion: "2026.9.3"

# Doctor-check scripts are wired via `supplementaryDoctorChecks.command`, which
# the unreferenced-file heuristic doesn't inspect. Silence those warnings.
# The rest is maintainer-only: nothing under them is installed.
ignore:
  - scripts/doctor-memories.ts
  - scripts/doctor-memories-remote.ts
  - tests/
  - .github/
  - package.json
  - tsconfig.json

prompts:
  - key: MEMORIES_REPO_URL
    type: input
    label: "Clone URL for the shared memories repo (e.g. git@github.com:org/memories.git)"

  - key: MEMORIES_BRANCH
    type: input
    label: "Branch name on the shared repo that holds memory files and this pack (e.g. main)"
    default: "main"

components:
  # ── Dependencies ──────────────────────────────────────────
  - id: node
    displayName: Node.js
    description: Runtime for the hooks and pack scripts. Node 22.6+ runs the TypeScript directly, with no build step.
    brew: node

  # ── Runtime ───────────────────────────────────────────────
  # The hook entry points are installed by the hook components below; this ships
  # the library they import, beside them, so `./lib/...` resolves the same way in
  # the pack checkout and once installed.
  - id: runtime
    displayName: Shared memories runtime
    description: The library the hooks import. Installed beside them, in .claude/hooks/shared-memories/lib/. `.mts` so module type never depends on the consumer's package.json.
    type: configuration
    installAction:
      type: copyPackFile
      source: runtime/lib
      destination: hooks/shared-memories/lib
      fileType: generic

  # ── Hooks ─────────────────────────────────────────────────
  - id: hook-memories-pull
    displayName: Pull shared memories and flag stuck state
    description: Fast-forwards the shared memories checkout on SessionStart. If a previous Stop hook's auto-push left uncommitted or unpushed work behind, a rebase is left half-finished, or the checkout has no upstream, emits a system-reminder so the engineer knows.
    hookEvent: SessionStart
    hookInterpreter: node --experimental-strip-types --disable-warning=ExperimentalWarning
    hookTimeout: 15
    hook:
      source: runtime/pull.mts
      destination: pull.mts

  - id: hook-memories-autopush
    displayName: Sync shared memories
    description: After Claude stops, commits every change under memories/ — additions, edits and deletions — as the git user, then rebases and pushes. Unconventional filenames halt everything until renamed.
    hookEvent: Stop
    hookInterpreter: node --experimental-strip-types --disable-warning=ExperimentalWarning
    hookTimeout: 30
    hookAsync: true
    hook:
      source: runtime/autopush.mts
      destination: autopush.mts

  # ── Commands ──────────────────────────────────────────────
  - id: command-resolve-memories
    displayName: /resolve-memories command
    description: Slash command for what the Stop hook can't fix on its own — merges rebase conflicts, renames files the naming guardrail rejects, restores a missing upstream — then commits and pushes. Diagnoses auth and git-identity failures, which need a human.
    command:
      source: commands/resolve-memories.md
      destination: resolve-memories.md

  # ── Configuration ─────────────────────────────────────────
  - id: gitignore
    description: Globally ignore the memories symlink, the backing sparse checkout, and any migration backup dirs so they're never tracked by parent repos
    gitignore:
      - .claude/memories
      - .claude/.memories-repo
      - .claude/.memories-migration-*

# ── CLAUDE.local.md section ───────────────────────────────
# Tells Claude the memories directory is a shared sparse checkout, not local
# scratch. Renders as `shared-memories.instructions` (mcs prefixes the pack id).
templates:
  - sectionIdentifier: instructions
    contentFile: templates/instructions.md

configureProject:
  script: scripts/configure-memories.ts

supplementaryDoctorChecks:
  - type: shellScript
    name: Shared memories setup (checkout + symlink)
    section: Shared Memories
    command: scripts/doctor-memories.ts
    fixScript: scripts/configure-memories.ts

  - type: shellScript
    name: Shared memories remote access (auth + reachability)
    section: Shared Memories
    command: scripts/doctor-memories-remote.ts
