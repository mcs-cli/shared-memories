schemaVersion: 1
identifier: shared-memories
displayName: "Shared Memories"
description: Team-shared Claude Code memories via a dedicated git repo
author: Bruno Guidolim
minMCSVersion: "2026.9.3"

# Doctor-check scripts are wired via `supplementaryDoctorChecks.command`, which
# the unreferenced-file heuristic doesn't inspect. Silence those warnings.
# The rest is maintainer-only: nothing under them is installed.
ignore:
  - scripts/doctor-memories.ts
  - scripts/doctor-memories-remote.ts
  - tests/
  - .github/
  - package.json
  - tsconfig.json

prompts:
  - key: MEMORIES_REPO_URL
    type: input
    label: "Clone URL for the shared memories repo (e.g. git@github.com:org/memories.git)"

  - key: MEMORIES_BRANCH
    type: input
    label: "Branch name on the shared repo that holds memory files and this pack (e.g. main)"
    default: "main"

  - key: MEMORIES_AUTOPUSH_MODE
    type: select
    label: "Stop-hook auto-push behavior"
    options:
      - value: auto
        label: "auto — writes auto-pushed, deletions parked (default)"
      - value: full
        label: "full — writes AND deletions auto-pushed"
      - value: review
        label: "review — nothing auto, per-turn pending-changes report"
    default: auto

components:
  # ── Dependencies ──────────────────────────────────────────
  - id: node
    displayName: Node.js
    description: Runtime for the hooks and pack scripts. Node 22.6+ runs the TypeScript directly, with no build step.
    brew: node

  # ── Runtime ───────────────────────────────────────────────
  # The hook entry points are installed by the hook components below; this ships
  # the library they import, beside them, so `./lib/...` resolves the same way in
  # the pack checkout and once installed.
  - id: runtime
    displayName: Shared memories runtime
    description: The library the hooks import. Installed beside them, in .claude/hooks/shared-memories/lib/. `.mts` so module type never depends on the consumer's package.json.
    isRequired: true
    dependencies: [node]
    type: configuration
    installAction:
      type: copyPackFile
      source: runtime/lib
      destination: hooks/shared-memories/lib
      fileType: generic

  # ── Hooks ─────────────────────────────────────────────────
  - id: hook-memories-pull
    displayName: Pull shared memories and flag stuck state
    description: Fast-forwards the shared memories checkout on SessionStart. If a previous Stop hook's auto-push left uncommitted or unpushed work behind, emits a system-reminder warning so the engineer knows.
    dependencies: [node, runtime]
    hookEvent: SessionStart
    hookInterpreter: node --experimental-strip-types --disable-warning=ExperimentalWarning
    hookTimeout: 15
    hook:
      source: runtime/pull.mts
      destination: pull.mts

  - id: hook-memories-autopush
    displayName: Sync shared memories
    description: After Claude stops, handles new/modified memory files according to MEMORIES_AUTOPUSH_MODE (auto/full/review). Default auto matches today — writes auto-pushed, deletions parked for manual review. Unconventional filenames halt everything until fixed in all modes. See README for the mode reference.
    dependencies: [node, runtime]
    hookEvent: Stop
    hookInterpreter: node --experimental-strip-types --disable-warning=ExperimentalWarning
    hookTimeout: 30
    hookAsync: true
    hook:
      source: runtime/autopush.mts
      destination: autopush.mts

  # ── Commands ──────────────────────────────────────────────
  - id: command-approve-memories
    displayName: /approve-memories command
    description: Slash command that stages, commits, pulls --rebase, and pushes all pending memory files. Primary use is `MEMORIES_AUTOPUSH_MODE=review` — the per-turn report tells both Claude and the user to invoke this to approve pending changes. Also unblocks state stuck from a previous push failure in auto/full mode.
    command:
      source: commands/approve-memories.md
      destination: approve-memories.md

  - id: hook-memories-announce
    displayName: Surface review-mode memory writes to Claude
    description: PostToolUse hook that injects additionalContext after a memory file is written, only when MEMORIES_AUTOPUSH_MODE=review. Lets Claude proactively mention pending memory review in conversation. Silent in auto/full modes.
    dependencies: [node, runtime]
    hookEvent: PostToolUse
    hookInterpreter: node --experimental-strip-types --disable-warning=ExperimentalWarning
    hookMatcher: Write|Edit|MultiEdit
    hookTimeout: 5
    hook:
      source: runtime/announce.mts
      destination: announce.mts

  # ── Configuration ─────────────────────────────────────────
  - id: settings
    displayName: Default auto-push mode
    description: Writes the chosen MEMORIES_AUTOPUSH_MODE value into .claude/settings.local.json so the Stop hook reads it. Re-run `mcs sync` to change modes, or edit settings.local.json directly.
    settingsFile: config/settings.json

  - id: gitignore
    description: Globally ignore the memories symlink, the backing sparse checkout, and any migration backup dirs so they're never tracked by parent repos
    isRequired: true
    gitignore:
      - .claude/memories
      - .claude/.memories-repo
      - .claude/.memories-migration-*

# ── CLAUDE.local.md section ───────────────────────────────
# Tells Claude the memories directory is a shared sparse checkout, not local
# scratch. Renders as `shared-memories.instructions` (mcs prefixes the pack id).
templates:
  - sectionIdentifier: instructions
    contentFile: templates/instructions.md

configureProject:
  script: scripts/configure-memories.ts

supplementaryDoctorChecks:
  - type: shellScript
    name: Shared memories setup (checkout + symlink)
    section: Shared Memories
    command: scripts/doctor-memories.ts
    fixScript: scripts/configure-memories.ts

  - type: shellScript
    name: Shared memories remote access (auth + reachability)
    section: Shared Memories
    command: scripts/doctor-memories-remote.ts
